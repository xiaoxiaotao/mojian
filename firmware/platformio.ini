[platformio]
default_envs = esp32-l
core_dir = ../../../.platformio
[env:esp32-l]
platform = espressif32@6.10.0
board = lolin32
board_build.partitions = partitions.csv
framework = arduino
; Project-local bounded parser, generated from the hash-locked upstream source.
extra_scripts = pre:tools/prepare_webserver.py
lib_extra_dirs = .pio/webserver-libs
monitor_speed = 115200
upload_speed = 115200
lib_deps =
  bblanchon/ArduinoJson@7.4.3
  h2zero/NimBLE-Arduino@1.4.3

build_flags =
  -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
  -D CONFIG_BT_NIMBLE_ATT_PREFERRED_MTU=64
  -D CONFIG_BT_NIMBLE_MSYS1_BLOCK_COUNT=4
  -D CONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
  -D CONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED

; Optical A/B candidate. Never flash as a routine production update.
; Only differential sleep skips the vendor 0x50=F7 rewrite.
[env:esp32-l-red-ghost-ab]
extends = env:esp32-l
build_flags =
  ${env:esp32-l.build_flags}
  -D MOJIAN_EXPERIMENT_BW_SLEEP=1

; Independent experiment: corrected-LUT initialization before POWER_ON.
; Vendor sleep is retained; never combine with the sleep experiment.
[env:esp32-l-bw-init-ab]
extends = env:esp32-l
build_flags =
  ${env:esp32-l.build_flags}
  -D MOJIAN_EXPERIMENT_BW_INIT=1

; Full-refresh register comparison, default off. Applies only the GxEPD2
; _Update_Full block (0x50=0x13, 0xE0/0x41) before DISPLAY_REFRESH; partial
; paths, sleep and the red band are unchanged.
[env:esp32-l-gx-full-ab]
extends = env:esp32-l
build_flags =
  ${env:esp32-l.build_flags}
  -D MOJIAN_EXPERIMENT_GX_FULL=1

; Same-model panel code is hash-locked; only base I/O is safety-adapted.
; Local HTTP/autonomy partial updates only. Full baseline still uses the A path.
[env:esp32-l-gx-reference-ab]
extends = env:esp32-l
extra_scripts =
  ${env:esp32-l.extra_scripts}
  pre:tools/prepare_gx_reference.py
lib_extra_dirs =
  ${env:esp32-l.lib_extra_dirs}
  .pio/reference-libs
build_flags =
  ${env:esp32-l.build_flags}
  -D MOJIAN_EXPERIMENT_GX_REFERENCE=1
