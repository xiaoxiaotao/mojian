plugins { id 'com.android.application' }
android {
    namespace 'com.desktodo.app'
    compileSdk 35
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    defaultConfig { applicationId 'com.desktodo.app'; minSdk 26; targetSdk 35; versionCode 21; versionName '0.8.0' }
}

// Direct Gradle builds must package the same verified font resources as the shell entry point.
tasks.register('prepareScreenFonts', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine 'python3', 'tools/prepare_screen_fonts.py', '--destination', 'android/app/src/main/assets/fonts'
}
tasks.named('preBuild').configure { dependsOn 'prepareScreenFonts' }
