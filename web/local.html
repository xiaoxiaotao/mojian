<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工作台直连</title><style>body{font:16px sans-serif;max-width:800px;margin:24px auto;padding:0 18px;background:#f5f5f0;color:#202922}h1{font-size:26px}section{background:white;padding:18px;margin:16px 0;border-radius:12px}input,button{font:inherit;padding:10px;box-sizing:border-box}input{width:100%;margin:6px 0}button{background:#254e3c;color:white;border:0;border-radius:7px;margin:6px 6px 6px 0}button:disabled{opacity:.5}small,p{line-height:1.6}article{padding:12px 0;border-bottom:1px solid #ddd;display:flex;gap:12px;align-items:center}article span{flex:1}img{width:100%;background:white}#state{white-space:pre-wrap}details{margin-top:16px}</style>
<h1>工作台 · 手机直连</h1><p>内容直接存入 ESP32，Mac 关闭后仍可添加和完成待办。手机与工作台需要连接同一局域网。</p>
<section><label>访问口令<input id="token" type="password" autocomplete="off" placeholder="与原工作台相同的访问口令"></label><button id="connect">连接设备</button><p id="state" role="status">请填写访问口令。蓝牙负责发现地址，信息通过本地Wi-Fi写入。</p></section>
<section><h2>独立待办</h2><p>最多四条。进入独立模式后，Mac 的清单不会覆盖这里；行情、天气保留最后画面，暂不独立获取。首次切换或设备重启后，写入需要一次全刷清除旧红色。</p><form id="add"><input id="title" maxlength="100" placeholder="要显示在屏幕上的事项" required><input id="due" type="datetime-local"><button id="save" disabled>写入屏幕</button></form><div id="tasks"></div><button id="remote" disabled>返回 Mac 同步模式（全刷一次）</button></section>
<section><h2>屏幕预览</h2><p>独立模式使用黑白文字，完成后移除。时间在联网校时成功后按分钟更新。</p><img id="preview" alt="工作台当前黑白画面"></section>
<script>
const $=id=>document.getElementById(id);let token='',state=null,base=null,busy=false;
const canvas=document.createElement('canvas');canvas.width=800;canvas.height=480;const ctx=canvas.getContext('2d',{willReadFrequently:true});
async function api(path,options={}){const response=await fetch(path,{...options,headers:{Authorization:'Bearer '+token,...(options.headers||{})}});if(!response.ok){let msg='连接失败，请确认手机与工作台在同一局域网';try{msg=(await response.json()).error||msg}catch{}throw Error(msg)}return response}
function notice(message){$('state').textContent=message}
function setBusy(value){busy=value;for(const id of ['save','remote','connect'])$(id).disabled=value||((id!=='connect')&&!state);for(const b of $('tasks').querySelectorAll('button'))b.disabled=value}
function decode(bytes){const image=ctx.createImageData(800,480);for(let i=0;i<384000;i++){const v=(bytes[i>>3]&(128>>(i%8)))?255:0;image.data[i*4]=image.data[i*4+1]=image.data[i*4+2]=v;image.data[i*4+3]=255}ctx.putImageData(image,0,0)}
function pack(){const pixels=ctx.getImageData(0,0,800,480).data,bytes=new Uint8Array(48000);for(let i=0;i<384000;i++)if(pixels[i*4]*.299+pixels[i*4+1]*.587+pixels[i*4+2]*.114>=160)bytes[i>>3]|=128>>(i%8);return bytes}
function label(value,x,y,size,width){ctx.fillStyle='black';ctx.font=size+'px sans-serif';while(ctx.measureText(value).width>width&&value.length>1)value=value.slice(0,-2)+'…';ctx.fillText(value,x,y)}
function box(x,y,w,h,fn){ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();ctx.fillStyle='white';ctx.fillRect(x,y,w,h);fn();ctx.restore()}
function due(t){if(!t.due)return '未设截止时间';const d=new Date(t.due);return (d<=new Date()?'已逾期 · ':'')+d.toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false})}
function render(tasks){decode(base);ctx.textBaseline='top';box(24,0,208,64,()=>{ctx.font='bold 56px sans-serif';ctx.fillStyle='black';ctx.fillText(new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'Asia/Shanghai'}),24,6)});box(24,64,208,40,()=>label(new Date().toLocaleDateString('zh-CN',{month:'2-digit',day:'2-digit',weekday:'short',timeZone:'Asia/Shanghai'}),26,72,18,204));
box(528,8,248,88,()=>{label('独立待办 · 手机直写',536,16,15,232);label(tasks[0]?.title||'暂无待办',536,43,21,232);label(tasks[0]?due(tasks[0]):'内容保存在设备内',536,76,14,232)});
box(536,112,240,40,()=>{label('待办清单',536,121,23,160);label(tasks.length+' 项',735,126,16,40)});
for(let i=0;i<4;i++)box(536,160+i*58,240,56,()=>{const t=tasks[i],y=164+i*58;if(!t){if(i===0)label('暂无待办',558,y,18,216);return}ctx.strokeStyle='black';ctx.strokeRect(538,y+5,10,10);label(t.title,558,y,18,216);label(due(t),558,y+27,13,216)});
box(528,432,248,32,()=>label(tasks.length+' 项待办 · 独立模式',536,436,16,232));box(24,464,752,16,()=>label('独立模式：行情与天气保留旧值，截止时间以手机为准',24,466,10,752));$('preview').src=canvas.toDataURL('image/png');return pack()}
function list(){const nodes=state.tasks.map((t,i)=>{const row=document.createElement('article'),text=document.createElement('span'),button=document.createElement('button');text.textContent=t.title+' · '+due(t);button.textContent='完成';button.onclick=()=>commit(state.tasks.filter((_,n)=>n!==i));row.append(text,button);return row});$('tasks').replaceChildren(...nodes);$('save').textContent=state.needs_full?'写入并全刷一次':'写入屏幕（局刷）'}
async function load(){state=await(await api('/api/local/state')).json();base=new Uint8Array(await(await api('/api/local/base')).arrayBuffer());if(base.length!==48000)throw Error('画面数据不完整');decode(base);$('preview').src=canvas.toDataURL('image/png');list();notice(state.local_mode?'已连接 ESP32 · 当前为独立模式':'已连接 ESP32 · 首次写入将切换独立模式并全刷一次')}
async function commit(tasks){if(busy)return;setBusy(true);try{const bytes=render(tasks),body=new FormData();body.append('metadata',JSON.stringify({tasks,updated_at:new Date().toISOString(),epoch_seconds:Math.floor(Date.now()/1000)}));body.append('frame',new Blob([bytes],{type:'application/octet-stream'}),'frame.bin');notice(state.needs_full?'正在全刷，请等待约20秒…':'正在写入并局部更新…');await api('/api/local/commit?full='+(state.needs_full?'1':'0'),{method:'POST',body});await load();notice('已写入设备并完成显示更新，Mac 关闭不影响保存');return true}catch(e){const message=e.message;await load().catch(()=>{});notice(message);return false}finally{setBusy(false)}}
$('connect').onclick=async()=>{token=$('token').value.trim();setBusy(true);try{await load();sessionStorage.setItem('desk-device-token',token)}catch(e){state=null;notice(e.message)}finally{setBusy(false)}};
$('add').onsubmit=async e=>{e.preventDefault();if(!state||busy)return;if(state.tasks.length>=4){notice('屏幕最多四条，请先完成一项');return}const title=$('title').value.trim();if(!title)return;if(await commit([...state.tasks,{title,due:$('due').value?new Date($('due').value).toISOString():null}])){$('title').value='';$('due').value=''}};
$('remote').onclick=async()=>{setBusy(true);try{await api('/api/local/remote',{method:'POST'});await load();notice('已切回 Mac 同步模式，并请求一次全刷')}catch(e){notice(e.message)}finally{setBusy(false)}};
$('token').value=sessionStorage.getItem('desk-device-token')||'';if($('token').value)$('connect').click();
</script></html>
