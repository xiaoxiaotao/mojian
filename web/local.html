<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工作台直连</title><style>body{font:16px sans-serif;max-width:800px;margin:24px auto;padding:0 18px;background:#f5f5f0;color:#202922}h1{font-size:26px}section{background:white;padding:18px;margin:16px 0;border-radius:12px}input,button{font:inherit;padding:10px;box-sizing:border-box}input{width:100%;margin:6px 0}button{background:#254e3c;color:white;border:0;border-radius:7px;margin:6px 6px 6px 0}button:disabled{opacity:.5}small,p{line-height:1.6}article{padding:12px 0;border-bottom:1px solid #ddd;display:flex;gap:12px;align-items:center}article span{flex:1}img{width:100%;background:white}#state{white-space:pre-wrap}details{margin-top:16px}</style>
<h1>工作台 · 手机直连</h1><p>内容直接存入 ESP32，Mac 关闭后仍可添加和完成待办。手机与工作台需要连接同一局域网。</p>
<section><button id="connect">连接设备</button><p id="state" role="status">无需访问口令，正在连接设备。蓝牙负责发现地址，信息通过本地 Wi-Fi 写入。</p></section>
<section><h2>独立待办</h2><p>保留当前综合布局，最多八条待办。新增和完成只更新待办区域，天气、股票和信息卡片保持原位；完成后从屏幕移除。</p><form id="add"><input id="title" maxlength="100" placeholder="要显示在屏幕上的事项" required><input id="due" type="datetime-local"><button id="save" disabled>写入屏幕</button></form><div id="tasks"></div><button id="remote" disabled>返回 Mac 同步模式（全刷一次）</button></section>
<section><h2>屏幕预览</h2><p>沿用设备当前布局；天气、行情等内容显示最近一次同步的值。</p><img id="preview" alt="工作台当前黑白画面"></section>
<script>
const $=id=>document.getElementById(id);let state=null,base=null,busy=false;
const canvas=document.createElement('canvas');canvas.width=800;canvas.height=480;const ctx=canvas.getContext('2d',{willReadFrequently:true});
async function api(path,options={}){const response=await fetch(path,options);if(!response.ok){let msg='连接失败，请确认手机与工作台在同一局域网';try{msg=(await response.json()).error||msg}catch{}throw Error(msg)}return response}
function notice(message){$('state').textContent=message}
function setBusy(value){busy=value;for(const id of ['save','remote','connect'])$(id).disabled=value||((id!=='connect')&&!state);for(const b of $('tasks').querySelectorAll('button'))b.disabled=value}
function decode(bytes){const image=ctx.createImageData(800,480);for(let i=0;i<384000;i++){const v=(bytes[i>>3]&(128>>(i%8)))?255:0;image.data[i*4]=image.data[i*4+1]=image.data[i*4+2]=v;image.data[i*4+3]=255}ctx.putImageData(image,0,0)}
function pack(){const pixels=ctx.getImageData(0,0,800,480).data,bytes=new Uint8Array(48000);for(let i=0;i<384000;i++)if(pixels[i*4]*.299+pixels[i*4+1]*.587+pixels[i*4+2]*.114>=160)bytes[i>>3]|=128>>(i%8);return bytes}
function label(value,x,y,size,width){ctx.fillStyle='black';ctx.font=size+'px sans-serif';while(ctx.measureText(value).width>width&&value.length>1)value=value.slice(0,-2)+'…';ctx.fillText(value,x,y)}
function box(x,y,w,h,fn){ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();ctx.fillStyle='white';ctx.fillRect(x,y,w,h);fn();ctx.restore()}
function due(t){if(!t.due)return '未设截止时间';const d=new Date(t.due);return (d<=new Date()?'已逾期 · ':'')+d.toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false})}
function taskArea(id){const p=(id||'').split('.'),kind=p[1];if(p[0]!=='mac'||kind==='calendar')throw Error('请先在 Mac 应用工作布局');let w=kind==='focus'||kind==='agenda'?500:kind==='pomodoro'?430:478,h=284;if(kind==='custom'){const ratio=Number(p[3])/100;if(!Number.isFinite(ratio)||ratio<.3||ratio>.85)throw Error('自定义布局参数无效');w=Math.floor(752*ratio/8)*8-24;h=338}if(!['focus','agenda','overview','minimal','pomodoro','living','custom'].includes(kind))throw Error('当前布局暂不支持手机编辑');return {kind,x:24,y:kind==='minimal'?150:118,w:kind==='minimal'?752:w,h:kind==='minimal'?254:h,limit:kind==='minimal'?3:kind==='custom'?7:kind==='agenda'||kind==='living'||kind==='pomodoro'?5:6}}
function render(tasks){const area=taskArea(state.layout_id);decode(base);ctx.textBaseline='top';box(area.x,area.y,area.w,area.h,()=>{
if(area.kind==='minimal'){for(let i=0;i<Math.min(tasks.length,3);i++){const t=tasks[i],y=160+i*76;ctx.strokeStyle='black';ctx.strokeRect(28,y+9,14,14);label(t.title,62,y,28,710);label(due(t),62,y+42,13,710)}if(!tasks.length)label('今天的留白，也很珍贵。',24,194,30,752);return}
label(area.kind==='agenda'?'今日安排':area.kind==='pomodoro'?'专心做事':area.kind==='living'?'留给自己的小事':area.kind==='custom'?'我的待办':'待办清单',24,118,23,area.w-70);label(tasks.length+' 项',24+area.w-55,123,15,55);
const count=Math.min(area.limit,Math.max(1,Math.floor((area.h-42)/46))),rowHeight=Math.min(58,(area.h-(tasks.length>count?64:40))/count);
for(let i=0;i<Math.min(tasks.length,count);i++){const t=tasks[i],top=160+i*rowHeight,left=area.kind==='agenda'?108:48;if(area.kind==='agenda')label(t.due?new Date(t.due).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',hour12:false}):'待定',24,top+1,17,76);else{ctx.strokeStyle='black';ctx.strokeRect(25,top+5,10,10)}label((t.pinned?'★ ':'')+t.title,left,top,19,area.w-(left-24));label(due(t),left,top+26,12,area.w-(left-24))}
if(!tasks.length)label('没有未完成事项，留点时间给自己。',26,182,18,area.w-2);if(tasks.length>count)label('另有 '+(tasks.length-count)+' 项，见手机清单',24,118+area.h-14,11,area.w);
});if(area.kind==='pomodoro')box(510,348,260,54,()=>label(tasks[0]?.title||'为自己留一段不被打扰的时间',510,348,18,260));$('preview').src=canvas.toDataURL('image/png');return pack()}
function list(){const nodes=state.tasks.map((t,i)=>{const row=document.createElement('article'),text=document.createElement('span'),button=document.createElement('button');text.textContent=t.title+' · '+due(t);button.textContent='完成';button.onclick=()=>commit(state.tasks.filter((_,n)=>n!==i));row.append(text,button);return row});$('tasks').replaceChildren(...nodes);$('save').textContent=state.needs_full?'写入并全刷一次':'写入屏幕（局刷）'}
async function load(){state=await(await api('/api/local/state')).json();base=new Uint8Array(await(await api('/api/local/base')).arrayBuffer());if(base.length!==48000)throw Error('画面数据不完整');decode(base);$('preview').src=canvas.toDataURL('image/png');list();taskArea(state.layout_id);notice(state.local_mode?'已连接 ESP32 · 当前为独立模式':'已连接 ESP32 · 首次写入将切换独立模式并全刷一次')}
async function commit(tasks){if(busy)return;setBusy(true);try{const bytes=render(tasks),body=new FormData();body.append('metadata',JSON.stringify({layout_id:state.layout_id,external_layout:true,accent_version:state.accent_version||'',accent_style:state.accent_style||'',tasks,updated_at:new Date().toISOString(),epoch_seconds:Math.floor(Date.now()/1000)}));body.append('frame',new Blob([bytes],{type:'application/octet-stream'}),'frame.bin');notice(state.needs_full?'正在全刷，请等待约20秒…':'正在写入并局部更新…');await api('/api/local/commit?full='+(state.needs_full?'1':'0'),{method:'POST',body});await load();notice('已写入设备并完成显示更新，Mac 关闭不影响保存');return true}catch(e){const message=e.message;await load().catch(()=>{});notice(message);return false}finally{setBusy(false)}}
$('connect').onclick=async()=>{setBusy(true);try{await load()}catch(e){state=null;notice(e.message)}finally{setBusy(false)}};
$('add').onsubmit=async e=>{e.preventDefault();if(!state||busy)return;if(state.tasks.length>=8){notice('最多八条，请先完成一项');return}const title=$('title').value.trim();if(!title)return;if(await commit([...state.tasks,{title,due:$('due').value?new Date($('due').value).toISOString():null}])){$('title').value='';$('due').value=''}};
$('remote').onclick=async()=>{setBusy(true);try{await api('/api/local/remote',{method:'POST'});await load();notice('已切回 Mac 同步模式，并请求一次全刷')}catch(e){notice(e.message)}finally{setBusy(false)}};
sessionStorage.removeItem('desk-device-token');$('connect').click();
</script></html>
